---
# The public variable is intentionally grouped under the role name.
traefik:  # noqa var-naming[no-role-prefix]
  image: "traefik:v3.7"
  container_name: "traefik"
  service_name: "traefik"
  network_name: "traefik"
  network_driver: "bridge"
  create_network: true

  # The directory is created on the managed host and mounted read-only.
  # Put dynamic file-provider configuration (routers, services, middlewares) here.
  dynamic_config_dir: "/etc/traefik/dynamic"
  dynamic_config_enabled: true
  dynamic_config_container_dir: "/etc/traefik/dynamic"

  docker_socket: "/var/run/docker.sock"
  log_level: "INFO"
  ports:
    - published_port: 80
      target_port: 80
      protocol: tcp
      publish_mode: ingress
    - published_port: 443
      target_port: 443
      protocol: tcp
      publish_mode: ingress

  # Common command-line arguments shared by standalone and Swarm deployments.
  command:
    - "--api.dashboard=true"
    - "--providers.file.directory={{ traefik.dynamic_config_container_dir }}"
    - "--providers.file.watch=true"
    - "--entrypoints.web.address=:80"
    - "--entrypoints.websecure.address=:443"
    - "--log.level={{ traefik.log_level }}"
  extra_command: []
  env: {}
  labels: {}
  restart_policy: "unless-stopped"
  swarm_replicas: 1
  swarm_update_config:
    parallelism: 1
    delay: "10s"
  swarm_placement_constraints:
    - "node.role == manager"
