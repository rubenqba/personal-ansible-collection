---
- name: Check whether Docker is running in Swarm mode
  community.docker.docker_swarm_info:
  register: traefik_swarm_info
  changed_when: false

- name: Set deployment mode
  ansible.builtin.set_fact:
    traefik_is_swarm: >-
      {{ (traefik_swarm_info.swarm_facts | default({})).LocalNodeState | default('inactive') == 'active' }}

- name: Ensure dynamic configuration directory exists
  ansible.builtin.file:
    path: "{{ traefik.dynamic_config_dir }}"
    state: directory
    mode: "0755"
  when: traefik.dynamic_config_enabled

- name: Deploy Traefik on Docker standalone
  ansible.builtin.include_tasks: standalone.yaml
  when: not traefik_is_swarm

- name: Require a Swarm manager for service deployment
  ansible.builtin.fail:
    msg: >-
      Traefik Swarm service deployment must run on a Swarm manager
      (ControlAvailable: true).
  when:
    - traefik_is_swarm
    - not (traefik_swarm_info.swarm_facts.ControlAvailable | default(false) | bool)

- name: Deploy Traefik on Docker Swarm
  ansible.builtin.include_tasks: swarm.yaml
  when: traefik_is_swarm
